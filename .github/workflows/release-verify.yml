name: Release Verify

# Verification for a proposed release build. This
# workflow deliberately does NOT build the release
# APK/AAB and does NOT publish anything: assembly
# needs binary inputs and signing material that are
# not in git (see BUILDING.md), and releases stay a
# gated, local act. What it proves, on the tagged
# tree, is that the release is *coherent*: all five
# version sources agree, the JVM suites pass, and
# the full Java source compiles against API 36.

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  version-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: littlestjames82-sys/ghost-ide
          path: ghost-ide
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: ghostide-android
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - name: Workspace layout check_versions.py expects
        run: |
          mkdir -p ~/workspace
          ln -s "$GITHUB_WORKSPACE/ghost-ide" ~/workspace/ghost-ide
          ln -s "$GITHUB_WORKSPACE/ghostide-android" ~/workspace/ghostide-apk-build
      - name: All five version sources agree
        run: python3 ~/workspace/ghostide-apk-build/check_versions.py

  jvm-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "17"
      - run: bash tests/jvm/run.sh

  java-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android SDK 36
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" "build-tools;36.0.0" || \
          yes | sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: aapt2 link + javac (build.sh steps 1-3)
        run: |
          BT="$ANDROID_HOME/build-tools/36.0.0"
          AJAR="$ANDROID_HOME/platforms/android-36/android.jar"
          SRC=app/src/main
          OUT=$(mktemp -d)
          mkdir -p "$OUT/gen" "$OUT/classes"
          "$BT/aapt2" compile --dir "$SRC/res" -o "$OUT/compiled_res.zip"
          "$BT/aapt2" link -o "$OUT/base.apk" -I "$AJAR" \
            --manifest "$SRC/AndroidManifest.xml" \
            -A "$SRC/assets" --java "$OUT/gen" \
            --min-sdk-version 24 --target-sdk-version 36 \
            "$OUT/compiled_res.zip"
          find "$OUT/gen" "$SRC/java" -name '*.java' > "$OUT/sources.txt"
          javac -encoding UTF-8 -source 8 -target 8 \
            -bootclasspath "$AJAR" -d "$OUT/classes" @"$OUT/sources.txt"
          echo "java compile OK"
