name: "CodeQL"
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: "17 15 * * 1"
jobs:
  analyze:
    name: Analyze (java-kotlin)
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "17"
      - name: Initialize CodeQL
        uses: github/codeql-action/init@a3d1b77a1ba1550fbb5c74db1dc3a11f4a481126 # v3
        with:
          languages: java-kotlin
          build-mode: manual
      # The build CodeQL traces is the same compile the CI
      # java-compile job proves: aapt2 link plus a full javac
      # of the app sources against API 36 (build.sh steps 1-3).
      # There is no Gradle build in this repo by design.
      - name: Install Android SDK 36
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" "build-tools;36.0.0" || \
          yes | sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: aapt2 link + javac (build.sh steps 1-3)
        run: |
          BT="$ANDROID_HOME/build-tools/36.0.0"
          AJAR="$ANDROID_HOME/platforms/android-36/android.jar"
          SRC=app/src/main
          OUT=$(mktemp -d)
          mkdir -p "$OUT/gen" "$OUT/classes"
          "$BT/aapt2" compile --dir "$SRC/res" -o "$OUT/compiled_res.zip"
          "$BT/aapt2" link -o "$OUT/base.apk" -I "$AJAR" \
            --manifest "$SRC/AndroidManifest.xml" \
            -A "$SRC/assets" --java "$OUT/gen" \
            --min-sdk-version 24 --target-sdk-version 36 \
            "$OUT/compiled_res.zip"
          find "$OUT/gen" "$SRC/java" -name '*.java' > "$OUT/sources.txt"
          javac -encoding UTF-8 -source 8 -target 8 \
            -bootclasspath "$AJAR" -d "$OUT/classes" @"$OUT/sources.txt"
          echo "java compile OK"
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@a3d1b77a1ba1550fbb5c74db1dc3a11f4a481126 # v3
        with:
          category: "/language:java-kotlin"
