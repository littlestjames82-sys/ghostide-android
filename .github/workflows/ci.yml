name: CI

# Hardening plan item 8: the suites that gate local
# releases, running on GitHub. Jobs: frontend harnesses
# + DOM-stub boot gate, JVM unit suites, full Java
# compile against API 36, and the live-server probes.
# The full APK assembly stays a local, documented
# build (BUILDING.md): it needs binary inputs that
# are not in git (native libs, python runtime stage).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: littlestjames82-sys/ghost-ide
          path: ghost-ide
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Workspace layout the harnesses expect
        run: |
          mkdir -p ~/workspace
          ln -s "$GITHUB_WORKSPACE/ghost-ide" ~/workspace/ghost-ide
      - name: Build the bundle
        working-directory: ghost-ide
        run: |
          npm install --no-audit --no-fund
          npm run build
      - name: UI harness suite
        working-directory: ghost-ide
        run: |
          fail=0
          for h in tools/harness/*-ui-harness.mjs \
                   tools/harness/chip-harness.mjs \
                   tools/harness/i18n-harness.mjs \
                   tools/harness/ghconnect_harness.mjs; do
            out=$(node "$h" web/src/main.js web/index.html 2>&1 | tail -1)
            echo "$h -> $out"
            case "$out" in
              *"0 failed"*|*"ALL PASS"*) ;;
              *) fail=1 ;;
            esac
          done
          exit $fail
      - name: DOM-stub boot gate
        working-directory: ghost-ide
        run: |
          out=$(node tools/runbundle.mjs "$PWD/web/app.js" 2>&1 | tail -1)
          echo "$out"
          echo "$out" | grep -q "defaultView"

  jvm-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: bash tests/jvm/run.sh

  java-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android SDK 36
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" "build-tools;36.0.0" || \
          yes | sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: aapt2 link + javac (build.sh steps 1-3)
        run: |
          BT="$ANDROID_HOME/build-tools/36.0.0"
          AJAR="$ANDROID_HOME/platforms/android-36/android.jar"
          SRC=app/src/main
          OUT=$(mktemp -d)
          mkdir -p "$OUT/gen" "$OUT/classes"
          "$BT/aapt2" compile --dir "$SRC/res" -o "$OUT/compiled_res.zip"
          "$BT/aapt2" link -o "$OUT/base.apk" -I "$AJAR" \
            --manifest "$SRC/AndroidManifest.xml" \
            -A "$SRC/assets" --java "$OUT/gen" \
            --min-sdk-version 24 --target-sdk-version 36 \
            "$OUT/compiled_res.zip"
          find "$OUT/gen" "$SRC/java" -name '*.java' > "$OUT/sources.txt"
          javac -encoding UTF-8 -source 8 -target 8 \
            -bootclasspath "$AJAR" -d "$OUT/classes" @"$OUT/sources.txt"
          echo "java compile OK"

  probes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: littlestjames82-sys/ghost-ide
          path: ghost-ide
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Live-server probe suites
        working-directory: ghost-ide/tools/probes
        run: |
          python3 hardening_probes.py
          python3 restore_probes.py
          python3 pair_probes.py
          python3 gh_connect_e2e.py
